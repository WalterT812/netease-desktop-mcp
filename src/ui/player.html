<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网易云 · 此刻</title>
<style>
:root{font-family:"HarmonyOS Sans SC","Segoe UI","Microsoft YaHei",sans-serif;color:#3c2949;background:transparent;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:12px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #9c77b3;outline-offset:3px}[hidden]{display:none!important}
.player{max-width:680px;margin:auto;border:1px solid #e3d8e6;border-radius:24px;padding:22px;background:linear-gradient(140deg,#fffefa,#f6f0fa);box-shadow:0 10px 30px #48325508}header{display:flex;align-items:center;gap:10px;margin-bottom:20px}.brand{font-size:12px;letter-spacing:2px;color:#87718f}.dot{width:6px;height:6px;background:#bca174;border-radius:50%}.state{font-size:11px;color:#97869e;margin-left:auto}.icon{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:11px;background:transparent;color:#87718f}.icon:hover{background:#eadfec}.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.song{display:flex;align-items:center;gap:22px}.art{width:124px;height:124px;flex:none;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#d8c9e2,#f0e9e4);display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:cover}.art span{font-size:44px;color:#aa94b5}.details{min-width:0;flex:1}h1{font-size:21px;font-weight:600;line-height:1.4;margin:0 0 8px;overflow-wrap:anywhere}.artist{font-size:13px;color:#8e7b98;margin:0 0 14px}.meta{font-size:11px;color:#9d8ca5}.controls{display:flex;gap:14px;align-items:center;margin-top:18px}.controls .icon{width:34px;height:34px}.controls .primary{background:#4a315b;color:#fffafc;width:44px;height:44px;border-radius:50%}.liked[aria-pressed=true]{color:#b56585;background:#f4e5ed}.liked[aria-pressed=true] svg{fill:currentColor}.lyrics{margin:22px 0 18px;padding:15px 12px;border-top:1px solid #e7deea;border-bottom:1px solid #e7deea;text-align:center;font-size:12px;line-height:1.9;color:#9c8da5;min-height:68px}.lyrics p{margin:2px 0;overflow-wrap:anywhere}.lyrics .current{color:#50355e;font-size:14px;font-weight:500}.conversation{display:flex;gap:8px;align-items:flex-end}textarea{min-height:44px;max-height:120px;resize:vertical;flex:1;min-width:0;padding:12px 14px;border:1px solid #e0d3e7;border-radius:15px;background:#fffcff;color:#44324d;font-size:13px;line-height:1.5}textarea::placeholder{color:#aa9ab1}.send{height:44px;min-width:58px;padding:0 14px;border:0;border-radius:14px;background:#4a315b;color:#fffbfd;font-size:12px}.hint{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:10px;color:#a08ea8}.status{font-size:12px;line-height:1.7;margin:12px 0 0;color:#806288;overflow-wrap:anywhere}.playlist-row{display:flex;gap:8px;margin:0 0 14px}.playlist-row select{flex:1;min-width:0;padding:9px;border:1px solid #ddcfe4;border-radius:12px;background:#fffcff;color:#6b5278;font-size:12px}.playlist-row button{border:1px solid #d4c2de;border-radius:12px;padding:8px 12px;background:#fbf7fd;color:#60456e;font-size:12px}
@media(max-width:400px){body{padding:7px}.player{padding:16px;border-radius:20px}.song{gap:14px}.art{width:86px;height:86px;border-radius:14px}h1{font-size:17px}.controls{gap:7px;margin-top:12px}.lyrics{margin-top:17px}.hint{font-size:9px}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;color:#eee5f2}.player{background:linear-gradient(145deg,#2c2233,#211b27);border-color:#4e3d59}.lyrics{border-color:#4e3d59}.lyrics .current{color:#e4d3ee}textarea,.playlist-row select,.playlist-row button{background:#302539;color:#e4d5ec;border-color:#594563}.icon:hover{background:#4b3558}.controls .primary,.send{background:#ceb7df;color:#2d1f38}}
.sliders{margin-top:18px;display:grid;gap:10px}.slider-row{display:flex;align-items:center;gap:10px;font-size:11px;color:#8e7b98}.slider-row input{min-width:0;flex:1;accent-color:#78528e}.slider-row output{font-variant-numeric:tabular-nums;min-width:40px}
</style></head><body>
<main class="player">
<header><span class="dot"></span><span class="brand">网易云 · 此刻</span><span class="state" id="connection">正在连接</span><button class="icon" id="refresh" aria-label="刷新歌曲" title="刷新歌曲"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M18 17a7 7 0 0 1-12 1l-2-3"/></svg></button><button class="icon" id="expand" aria-label="展开播放器" title="展开播放器" hidden><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></button></header>
<section class="song"><div class="art"><span id="art-placeholder">♫</span><img id="cover" alt="歌曲封面" referrerpolicy="no-referrer" hidden></div><div class="details"><h1 id="title">听见这一刻</h1><p class="artist" id="artist">等待网易云音乐</p><div class="meta" id="meta">—</div>
<div class="controls"><button class="icon" id="previous" aria-label="上一首" disabled><svg viewBox="0 0 24 24"><path d="M5 5v14M19 5 8 12l11 7Z"/></svg></button><button class="icon primary" id="play" aria-label="播放" disabled><svg viewBox="0 0 24 24"><path id="play-path" d="m9 5 11 7-11 7Z"/></svg></button><button class="icon" id="next" aria-label="下一首" disabled><svg viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg></button><button class="icon liked" id="like" aria-label="喜欢状态未知" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><path d="M12 20 3.5 11.5a5 5 0 0 1 8.5-5 5 5 0 0 1 8.5 5Z"/></svg></button><button class="icon" id="save" aria-label="收藏到歌单" title="让 Codex 帮你收藏到歌单" disabled><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4ZM9 9h6M12 6v6"/></svg></button></div></div></section>
<div class="sliders"><label class="slider-row">进度<input id="seek" type="range" min="0" max="1" step="1" disabled><output id="position">—</output></label><label class="slider-row">音量<input id="volume" type="range" min="0" max="100" step="1" disabled><output id="volume-label">—</output></label></div>
<section class="lyrics" id="lyrics" aria-label="歌词"><p>正在读取歌曲</p></section>
<div class="playlist-row" id="playlist-row" hidden><select id="playlist" aria-label="选择收藏歌单"></select><button id="playlist-send">交给 Codex</button></div>
<form class="conversation" id="message-form"><textarea id="message" aria-label="给 Codex 的音乐指令" placeholder="告诉我，你想听什么…" rows="1" maxlength="2000"></textarea><button class="send" id="send" type="submit" disabled>发送</button></form>
<div class="hint"><span>发给此卡片所在对话 · 回复在原聊天中</span><span id="updated">—</span></div><p class="status" id="status" role="status" hidden></p>
</main>
<script>
// MCP Apps bridge adapted from the official vanilla quickstart. No privileged host globals.
(()=>{
 const $=id=>document.getElementById(id),pending=new Map();let sequence=0,ready=false,canMessage=false,closed=false,player=null,busy=false,polling=false,pollTimer,sendBusy=false,unknownSend=false,lastRead=0,sizeObserver,seekTrack=null,seekEditing=false,volumeEditing=false;
 const notice=text=>{$('status').textContent=text;$('status').hidden=!text;};
 const notify=(method,params)=>window.parent.postMessage({jsonrpc:'2.0',method,params},'*');
 function observeSize(){if(typeof ResizeObserver==='undefined')return;let previous=0;sizeObserver=new ResizeObserver(()=>{const height=Math.ceil(document.body.getBoundingClientRect().height);if(height!==previous){previous=height;notify('ui/notifications/size-changed',{height});}});sizeObserver.observe(document.body);}
 function request(method,params,timeout=20000){return new Promise((resolve,reject)=>{const id=++sequence,timer=setTimeout(()=>{pending.delete(id);reject(Error('等待超时，结果未知。请先查看实际状态，不要重复提交。'));},timeout);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
 function render(result){if(!result||typeof result!=='object'||!Object.hasOwn(result,'trackId'))return;player=result;lastRead=Date.now();$('title').textContent=result.title||'暂无播放歌曲';$('artist').textContent=(result.artists||[]).map(a=>a.name).join(' / ')||'未知歌手';
  let cover=null;try{const u=new URL(result.coverUrl);if(u.protocol==='https:'&&u.hostname.endsWith('.music.126.net')&&!u.username&&!u.password)cover=u.href;}catch{}
  if(cover){if($('cover').getAttribute('src')!==cover)$('cover').src=cover;$('cover').hidden=false;$('art-placeholder').hidden=true;}else{$('cover').hidden=true;$('cover').removeAttribute('src');$('art-placeholder').hidden=false;}
  const seconds=result.durationSeconds;$('meta').textContent=(typeof seconds==='number'?Math.floor(seconds/60)+':'+String(Math.floor(seconds%60)).padStart(2,'0'):'时长未知')+(result.mode==='playOneCycle'?' · 单曲循环':'');
  $('play').ariaLabel=result.playing===true?'暂停':result.playing===false?'播放':'播放状态未知';$('play-path').setAttribute('d',result.playing===true?'M8 5v14M16 5v14':'m9 5 11 7-11 7Z');$('like').setAttribute('aria-pressed',String(result.liked===true));$('like').ariaLabel=result.liked===true?'取消喜欢':result.liked===false?'喜欢':'喜欢状态未知';
  if(!seekEditing){$('seek').max=String(result.durationSeconds||1);$('seek').value=String(result.positionSeconds||0);$('position').textContent=typeof result.positionSeconds==='number'?Math.floor(result.positionSeconds/60)+':'+String(Math.floor(result.positionSeconds%60)).padStart(2,'0'):'—';}
  if(!volumeEditing){$('volume').value=String(result.volumePercent||0);$('volume-label').textContent=typeof result.volumePercent==='number'?result.volumePercent+'%':'—';}
  $('lyrics').replaceChildren();const lyricMatches=!result.lyricTrackId||result.lyricTrackId===result.trackId;const lines=lyricMatches&&Array.isArray(result.lyrics)?result.lyrics:null;const index=Number.isInteger(result.lyricLine)?result.lyricLine:-1;
  const empty=lyricMatches&&result.lyricStatus==='instrumental'?'纯音乐 · 暂无歌词':lines?'这首歌暂无歌词':'歌词暂时无法读取';
  for(const [offset,line] of (lines?.length?lines.slice(Math.max(0,index-1),Math.max(0,index-1)+3):[empty]).entries()){const p=document.createElement('p');p.textContent=String(line);const current=lines?.length&&Math.max(0,index-1)+offset===index;if(current)p.className='current';$('lyrics').append(p);const translated=current?result.timedLyrics?.[index]?.translation:null;if(typeof translated==='string'&&translated){const t=document.createElement('p');t.className='translation';t.textContent=translated;$('lyrics').append(t);}}
  $('connection').textContent='已连接';$('updated').textContent='刚刚更新';controls();
 }
 function controls(){const available=ready&&!busy&&player&&Date.now()-lastRead<15000;for(const id of ['previous','next'])$(id).disabled=!available;$('play').disabled=!available||typeof player?.playing!=='boolean';$('like').disabled=!available||typeof player?.liked!=='boolean'||!player.trackKey;$('save').disabled=!available||!canMessage||!player.trackId;$('seek').disabled=!available||!player?.canSeek;$('volume').disabled=!available||typeof player?.volumePercent!=='number';$('send').disabled=!canMessage||sendBusy||unknownSend;}
 async function call(name,args={}){const result=await request('tools/call',{name,arguments:args});if(result?.isError)throw Error(result.content?.find(c=>c.type==='text')?.text||'操作未完成');return result?.structuredContent?.result;}
 async function refresh(){if(!ready||polling||busy||closed||document.hidden)return;polling=true;try{render(await call('netease_get_player'));}catch(e){$('connection').textContent='连接待恢复';$('updated').textContent='显示上次读取';controls();}finally{polling=false;}}
 function schedule(){clearTimeout(pollTimer);if(closed)return;pollTimer=setTimeout(async()=>{await refresh();schedule();},3000);}
 async function action(name,args){if(busy)return;busy=true;controls();notice('');try{await call(name,args);notice('操作已核验');}catch(e){notice(e.message||'操作结果未知，请查看网易云后再操作。');}finally{busy=false;await refresh();controls();}}
 $('seek').oninput=()=>{if(!seekEditing)seekTrack=player?.trackId;seekEditing=true;$('position').textContent=Math.floor(Number($('seek').value)/60)+':'+String(Math.floor(Number($('seek').value)%60)).padStart(2,'0');};
 $('seek').onchange=()=>{const id=seekTrack,seconds=Number($('seek').value);seekEditing=false;seekTrack=null;if(id&&id===player?.trackId)void action('netease_seek',{trackId:id,seconds});else{notice('歌曲已经切换，请重新选择进度。');void refresh();}};
 $('volume').oninput=()=>{volumeEditing=true;$('volume-label').textContent=$('volume').value+'%';};$('volume').onchange=()=>{volumeEditing=false;void action('netease_set_volume',{percent:Number($('volume').value)});};
 $('cover').onerror=()=>{$('cover').hidden=true;$('art-placeholder').hidden=false;};
 $('refresh').onclick=()=>refresh();$('previous').onclick=()=>action('netease_skip_track',{direction:'previous'});$('next').onclick=()=>action('netease_skip_track',{direction:'next'});$('play').onclick=()=>{if(typeof player?.playing==='boolean')action('netease_set_playback',{action:player.playing?'pause':'play'});};$('like').onclick=()=>{if(typeof player?.liked==='boolean')action('netease_set_liked',{liked:!player.liked,trackKey:player.trackKey});};
 async function send(text,context,clearInput=false){if(!canMessage||sendBusy||unknownSend||!text.trim())return;sendBusy=true;controls();notice('');const original=$('message').value;try{await request('ui/message',{role:'user',content:[{type:'text',text:text.trim()+'\n\n歌曲参考信息（卡片提交时）：'+JSON.stringify(context)}]},60000);if(clearInput&&$('message').value===original)$('message').value='';notice('已提交给此卡片所在对话。请在原聊天查看回复。');}catch(e){if(String(e.message).includes('超时'))unknownSend=true;notice(e.message||'消息未提交，原文已保留。');}finally{sendBusy=false;controls();}}
 const context=()=>({trackId:player?.trackId,title:player?.title,artists:player?.artists?.map(a=>a.name)});
 $('message-form').onsubmit=e=>{e.preventDefault();void send($('message').value,context(),true);};
 let savedTrack=null;
 $('save').onclick=async()=>{savedTrack=context();$('playlist-row').hidden=false;$('playlist').replaceChildren();$('playlist-send').disabled=true;notice('正在读取可收藏的歌单…');try{const list=await call('netease_list_playlists');for(const p of list.created||[]){const option=document.createElement('option');option.value=p.id;option.textContent=p.title;$('playlist').append(option);}$('playlist-send').disabled=!$('playlist').options.length;notice($('playlist').options.length?'选好后交给 Codex 处理；这里只提交请求，不表示已经收藏。':'没有可选择的自建歌单。');}catch(e){notice(e.message);}};
 $('playlist-send').onclick=()=>{const option=$('playlist').selectedOptions[0];if(option)void send('请把歌曲参考信息中的这首歌加入我的歌单 '+JSON.stringify({id:option.value,title:option.textContent})+'。请核验歌曲 ID 和添加结果；工具尚不支持时告诉我。',savedTrack);};
 $('expand').onclick=async()=>{try{await request('ui/request-display-mode',{mode:'fullscreen'});}catch(e){notice('当前容器无法展开，仍可在卡片中使用。');}};
 window.addEventListener('message',event=>{if(event.source!==window.parent||closed)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(!m.method&&typeof m.id==='number'&&pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(Error(m.error.message||'宿主拒绝了请求')):p.resolve(m.result);return;}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent?.result);if(m.method==='ui/resource-teardown'){closed=true;sizeObserver?.disconnect();clearTimeout(pollTimer);for(const p of pending.values()){clearTimeout(p.timer);p.reject(Error('播放器已关闭'));}pending.clear();if(m.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*');}});
 window.addEventListener('pagehide',()=>{closed=true;sizeObserver?.disconnect();clearTimeout(pollTimer);for(const p of pending.values())clearTimeout(p.timer);pending.clear();});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)void refresh();});
 request('ui/initialize',{appInfo:{name:'netease-player',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(host=>{ready=true;canMessage=!!host?.hostCapabilities?.message?.text;$('expand').hidden=!host?.hostContext?.availableDisplayModes?.includes('fullscreen');notify('ui/notifications/initialized',{});observeSize();controls();void refresh();schedule();if(!canMessage)notice('当前容器未提供发消息能力，请在 Codex 原聊天输入。');}).catch(()=>{$('connection').textContent='尚未连接';notice('请通过 Codex 的“打开网易云播放器”工具打开此卡片。');});
})();
</script></body></html>
